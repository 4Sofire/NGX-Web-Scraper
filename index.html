<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NGX Ticker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg:        #0d1117;
    --bg2:       #161b22;
    --bg3:       #21262d;
    --border:    #30363d;
    --text:      #e6edf3;
    --muted:     #7d8590;
    --green:     #3fb950;
    --green-dim: #1a4a1f;
    --red:       #f85149;
    --red-dim:   #4a1a1a;
    --amber:     #e3b341;
    --blue:      #58a6ff;
    --buy-bg:    #0d2818;
    --sell-bg:   #2d0f0f;
    --hold-bg:   #1c1c0d;
    --font:      'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    --sans:      -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ── Title bar ── */
  #titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
    flex-shrink: 0;
  }
  #titlebar .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--text);
  }
  #titlebar .brand .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  #titlebar .controls {
    display: flex;
    gap: 6px;
    -webkit-app-region: no-drag;
  }
  .wbtn {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .wbtn:hover { opacity: 0.8; }
  #btn-close    { background: #ff5f57; }
  #btn-minimize { background: #ffbd2e; }
  #btn-pin      { background: #28c840; }

  /* ── Status bar ── */
  #statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
    flex-shrink: 0;
  }
  #last-update { font-family: var(--font); }

  /* ── Tabs ── */
  #tabs {
    display: flex;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 7px 0;
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    letter-spacing: 0.04em;
  }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  /* ── Panel content ── */
  .panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .panel.active { display: flex; }

  /* ── Watchlist panel ── */
  #watchlist-search {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #watchlist-search input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    color: var(--text);
    font-size: 12px;
    outline: none;
  }
  #watchlist-search input::placeholder { color: var(--muted); }

  #ticker-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  #ticker-list::-webkit-scrollbar { width: 4px; }
  #ticker-list::-webkit-scrollbar-track { background: var(--bg); }
  #ticker-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .ticker-card {
    margin: 3px 8px;
    padding: 8px 10px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }
  .ticker-card:hover { border-color: var(--blue); background: var(--bg3); }

  .ticker-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .ticker-sym {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    color: var(--blue);
  }
  .ticker-name {
    font-size: 10px;
    color: var(--muted);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
  }
  .ticker-price-block { text-align: right; }
  .ticker-price {
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
  }
  .ticker-change {
    font-family: var(--font);
    font-size: 10px;
    margin-top: 1px;
  }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neu { color: var(--muted); }

  .ticker-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }
  .ticker-vol {
    font-size: 9px;
    color: var(--muted);
    font-family: var(--font);
  }
  canvas.sparkline {
    display: block;
  }

  .signal-badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .sig-BUY  { background: var(--buy-bg);  color: var(--green); border: 1px solid var(--green-dim); }
  .sig-SELL { background: var(--sell-bg); color: var(--red);   border: 1px solid var(--red-dim); }
  .sig-HOLD { background: var(--hold-bg); color: var(--amber); border: 1px solid #3d3000; }
  .sig-WAIT { background: var(--bg3);    color: var(--muted); border: 1px solid var(--border); }

  /* ── Catalogue panel ── */
  #catalogue-search {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #catalogue-search input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    color: var(--text);
    font-size: 12px;
    outline: none;
  }
  #catalogue-search input::placeholder { color: var(--muted); }
  #symbol-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px;
  }
  #symbol-list::-webkit-scrollbar { width: 4px; }
  #symbol-list::-webkit-scrollbar-track { background: var(--bg); }
  #symbol-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sym-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .sym-row:hover { background: var(--bg3); }
  .sym-row .sym-label { font-family: var(--font); font-size: 11px; color: var(--blue); min-width: 80px; }
  .sym-row .sym-name  { font-size: 10px; color: var(--muted); flex: 1; margin: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sym-row .sym-price { font-family: var(--font); font-size: 11px; }
  .add-btn {
    width: 20px; height: 20px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--green);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    margin-left: 6px;
    flex-shrink: 0;
    transition: background 0.12s, border-color 0.12s;
  }
  .add-btn:hover { background: var(--buy-bg); border-color: var(--green); }
  .add-btn.added { color: var(--muted); border-color: var(--border); cursor: default; font-size: 12px; }

  /* ── Analysis panel ── */
  #analysis-panel {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }
  #analysis-panel::-webkit-scrollbar { width: 4px; }
  #analysis-panel::-webkit-scrollbar-track { background: var(--bg); }
  #analysis-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .analysis-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .analysis-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .a-sym { font-family: var(--font); font-size: 12px; font-weight: 600; color: var(--blue); }
  .a-name { font-size: 10px; color: var(--muted); margin-top: 1px; }
  .analysis-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 8px;
  }
  .a-metric {
    background: var(--bg3);
    border-radius: 5px;
    padding: 5px 8px;
  }
  .a-metric .label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .a-metric .value { font-family: var(--font); font-size: 12px; margin-top: 2px; }

  .rsi-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .rsi-bar {
    height: 4px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
  }
  .rsi-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.4s;
  }
  .chart-wrap {
    margin-top: 6px;
    background: var(--bg3);
    border-radius: 5px;
    padding: 6px 8px;
  }
  .chart-label {
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  /* ── Footer ── */
  #footer {
    padding: 6px 12px;
    border-top: 1px solid var(--border);
    background: var(--bg2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #footer label { font-size: 10px; color: var(--muted); }
  #footer select {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 10px;
    border-radius: 4px;
    padding: 2px 4px;
    outline: none;
    cursor: pointer;
  }
  .empty-msg {
    padding: 20px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<!-- Title bar -->
<div id="titlebar">
  <div class="brand">
    <div class="dot"></div>
    NGX TICKER
  </div>
  <div class="controls">
    <button class="wbtn" id="btn-pin"      title="Toggle always-on-top"></button>
    <button class="wbtn" id="btn-minimize" title="Minimise"></button>
    <button class="wbtn" id="btn-close"    title="Close"></button>
  </div>
</div>

<!-- Status bar -->
<div id="statusbar">
  <span id="last-update">Connecting…</span>
  <span id="source-badge" style="font-size:9px;font-family:monospace;"></span>
</div>

<!-- Tabs -->
<div id="tabs">
  <div class="tab active" data-tab="watchlist">Watchlist</div>
  <div class="tab"        data-tab="catalogue">All Stocks</div>
  <div class="tab"        data-tab="analysis">Analysis</div>
</div>

<!-- Watchlist Panel -->
<div class="panel active" id="panel-watchlist">
  <div id="watchlist-search">
    <input type="text" id="wl-filter" placeholder="Filter watchlist…">
  </div>
  <div id="ticker-list">
    <div class="empty-msg">Add stocks from the<br>"All Stocks" tab</div>
  </div>
</div>

<!-- Catalogue Panel -->
<div class="panel" id="panel-catalogue">
  <div id="catalogue-search">
    <input type="text" id="cat-filter" placeholder="Search symbol or name…">
  </div>
  <div id="symbol-list">
    <div class="empty-msg">Loading stocks…</div>
  </div>
</div>

<!-- Analysis Panel -->
<div class="panel" id="panel-analysis">
  <div id="analysis-panel">
    <div class="empty-msg">Add stocks to watchlist<br>to see analysis</div>
  </div>
</div>

<!-- Footer -->
<div id="footer">
  <label>Refresh:
    <select id="refresh-rate">
      <option value="10000">10 s</option>
      <option value="30000" selected>30 s</option>
      <option value="60000">60 s</option>
      <option value="300000">5 min</option>
    </select>
  </label>
  <span id="watchlist-count" style="font-size:10px;color:var(--muted);">0 watching</span>
</div>

<script>
// ── All IPC via window.electronAPI (set up by preload.js) ─────────────────
const api = window.electronAPI;

let allStocks  = {};
let allHistory = {};
let activeTab  = 'watchlist';
let watchlist  = JSON.parse(localStorage.getItem('ngx-watchlist') || '[]');

// ── Tabs ─────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeTab = t.dataset.tab;
    document.getElementById('panel-' + activeTab).classList.add('active');
    render();
  });
});

// ── Window controls ───────────────────────────────────────────────────────
document.getElementById('btn-close').addEventListener('click',    () => api.closeApp());
document.getElementById('btn-minimize').addEventListener('click', () => api.minimizeApp());
document.getElementById('btn-pin').addEventListener('click',      () => api.togglePin());
document.getElementById('refresh-rate').addEventListener('change', e => {
  api.setRefreshRate(parseInt(e.target.value));
});

// ── Stock updates from main process ───────────────────────────────────────
api.onStockUpdate(({ stocks, history, liveDataAvailable, stockCount }) => {
  allStocks  = stocks;
  allHistory = history;

  const now = new Date();
  const timeStr = now.toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  if (liveDataAvailable) {
    document.getElementById('last-update').textContent = 'Live ✓ ' + timeStr;
    document.getElementById('last-update').style.color = 'var(--green)';
  } else if (stockCount > 0) {
    document.getElementById('last-update').textContent = 'Cached · ' + timeStr;
    document.getElementById('last-update').style.color = 'var(--amber)';
  } else {
    document.getElementById('last-update').textContent = 'No data — retrying…';
    document.getElementById('last-update').style.color = 'var(--red)';
  }

  const sources = [...new Set(Object.values(stocks).map(s => s.source))];
  const badge = document.getElementById('source-badge');
  badge.textContent = sources.length ? sources.join(' · ') + ' · 30m delay' : '';

  render();
});

// ── Render dispatcher ─────────────────────────────────────────────────────
function render() {
  if (activeTab === 'watchlist') renderWatchlist();
  if (activeTab === 'catalogue') renderCatalogue();
  if (activeTab === 'analysis')  renderAnalysis();
}

// ── Formatters ────────────────────────────────────────────────────────────
function fmt(n) {
  if (n === undefined || n === null || isNaN(n)) return '—';
  return '₦' + n.toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtVol(n) {
  if (!n) return '—';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
  return n.toLocaleString();
}
function pctChange(price, prev) {
  if (!prev || prev === 0) return null;
  return (price - prev) / prev * 100;
}
function sigClass(sig) { return 'sig-' + (sig || 'WAIT'); }

// ── Sparkline ─────────────────────────────────────────────────────────────
function drawSparkline(canvas, data, isPos, w, h) {
  canvas.width  = w || 80;
  canvas.height = h || 24;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!data || data.length < 2) return;

  const W = canvas.width, H = canvas.height;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;

  const pts = data.map((v, i) => ({
    x: i * (W / (data.length - 1)),
    y: H - ((v - min) / range) * (H - 4) - 2
  }));

  const color = isPos === false ? '#f85149' : '#3fb950';

  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
  ctx.strokeStyle = color;
  ctx.lineWidth   = 1.5;
  ctx.stroke();

  ctx.lineTo(pts[pts.length - 1].x, H);
  ctx.lineTo(pts[0].x, H);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, isPos === false ? 'rgba(248,81,73,0.25)' : 'rgba(63,185,80,0.25)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fill();
}

// ── Watchlist ─────────────────────────────────────────────────────────────
async function renderWatchlist() {
  const filter = (document.getElementById('wl-filter').value || '').toLowerCase();
  const container = document.getElementById('ticker-list');
  document.getElementById('watchlist-count').textContent = watchlist.length + ' watching';

  const toShow = watchlist.filter(sym =>
    !filter ||
    sym.toLowerCase().includes(filter) ||
    (allStocks[sym]?.name || '').toLowerCase().includes(filter)
  );

  if (toShow.length === 0) {
    container.innerHTML = watchlist.length === 0
      ? '<div class="empty-msg">Add stocks from the<br>"All Stocks" tab</div>'
      : '<div class="empty-msg">No matches</div>';
    return;
  }

  // Build all cards (with async signals) then swap DOM once
  const fragments = await Promise.all(toShow.map(async sym => {
    const s    = allStocks[sym];
    if (!s) return null;
    const hist = allHistory[sym] || [];
    const prev = s.prevClose || s.open || (hist.length > 1 ? hist[hist.length - 2] : null);
    const pct  = pctChange(s.price, prev);
    const isPos = pct === null ? null : pct >= 0;
    const { signal, strength } = await api.getSignal(sym);
    return { sym, s, hist, pct, isPos, signal, strength };
  }));

  container.innerHTML = '';

  fragments.filter(Boolean).forEach(({ sym, s, hist, pct, isPos, signal, strength }) => {
    const card = document.createElement('div');
    card.className = 'ticker-card';
    card.innerHTML = `
      <div class="ticker-top">
        <div>
          <div class="ticker-sym">${sym}</div>
          <div class="ticker-name" title="${s.name}">${s.name}</div>
        </div>
        <div class="ticker-price-block">
          <div class="ticker-price ${isPos === null ? 'neu' : isPos ? 'pos' : 'neg'}">${fmt(s.price)}</div>
          <div class="ticker-change ${isPos === null ? 'neu' : isPos ? 'pos' : 'neg'}">
            ${pct === null ? '—' : (pct >= 0 ? '▲' : '▼') + ' ' + Math.abs(pct).toFixed(2) + '%'}
          </div>
        </div>
      </div>
      <div class="ticker-bottom">
        <div>
          <div class="ticker-vol">Vol: ${fmtVol(s.volume)}</div>
          <span class="signal-badge ${sigClass(signal)}" style="margin-top:3px;display:inline-block;">
            ${signal}${strength ? ' ' + strength + '%' : ''}
          </span>
        </div>
        <canvas id="spark-${sym}" width="80" height="24"></canvas>
      </div>
    `;

    card.addEventListener('contextmenu', () => {
      watchlist = watchlist.filter(x => x !== sym);
      localStorage.setItem('ngx-watchlist', JSON.stringify(watchlist));
      renderWatchlist();
    });

    container.appendChild(card);

    requestAnimationFrame(() => {
      const cv = document.getElementById('spark-' + sym);
      if (cv) drawSparkline(cv, hist, isPos !== false, 80, 24);
    });
  });
}

document.getElementById('wl-filter').addEventListener('input', renderWatchlist);

// ── Catalogue ─────────────────────────────────────────────────────────────
function renderCatalogue() {
  const filter = (document.getElementById('cat-filter').value || '').toLowerCase();
  const container = document.getElementById('symbol-list');

  const syms = Object.keys(allStocks)
    .filter(sym =>
      !filter ||
      sym.toLowerCase().includes(filter) ||
      (allStocks[sym]?.name || '').toLowerCase().includes(filter)
    )
    .sort();

  if (syms.length === 0) {
    container.innerHTML = '<div class="empty-msg">No stocks found</div>';
    return;
  }

  container.innerHTML = '';
  syms.forEach(sym => {
    const s    = allStocks[sym];
    const prev = s.prevClose || s.open;
    const pct  = pctChange(s.price, prev);
    const isPos = pct === null ? null : pct >= 0;
    const inList = watchlist.includes(sym);

    const row = document.createElement('div');
    row.className = 'sym-row';
    row.innerHTML = `
      <span class="sym-label">${sym}</span>
      <span class="sym-name" title="${s.name}">${s.name}</span>
      <span class="sym-price ${isPos === null ? 'neu' : isPos ? 'pos' : 'neg'}">${fmt(s.price)}</span>
      <button class="add-btn ${inList ? 'added' : ''}" data-sym="${sym}">
        ${inList ? '✓' : '+'}
      </button>
    `;

    row.querySelector('.add-btn').addEventListener('click', e => {
      e.stopPropagation();
      if (!watchlist.includes(sym)) {
        watchlist.push(sym);
        localStorage.setItem('ngx-watchlist', JSON.stringify(watchlist));
        renderCatalogue();
        document.getElementById('watchlist-count').textContent = watchlist.length + ' watching';
      }
    });

    container.appendChild(row);
  });
}

document.getElementById('cat-filter').addEventListener('input', renderCatalogue);

// ── Analysis ──────────────────────────────────────────────────────────────
async function renderAnalysis() {
  const container = document.getElementById('analysis-panel');

  if (watchlist.length === 0) {
    container.innerHTML = '<div class="empty-msg">Add stocks to watchlist<br>to see analysis</div>';
    return;
  }

  const cards = await Promise.all(watchlist.map(async sym => {
    const s = allStocks[sym];
    if (!s) return null;
    const hist  = allHistory[sym] || [];
    const prev  = s.prevClose || s.open || (hist.length > 1 ? hist[hist.length - 2] : null);
    const pct   = pctChange(s.price, prev);
    const isPos = pct === null ? null : pct >= 0;
    const { signal, strength, rsi } = await api.getSignal(sym);
    const rangeW = (s.high && s.low)
      ? Math.min(100, Math.max(0, ((s.price - s.low) / ((s.high - s.low) || 1)) * 100))
      : 50;
    return { sym, s, hist, pct, isPos, signal, strength, rsi, rangeW };
  }));

  container.innerHTML = '';

  cards.filter(Boolean).forEach(({ sym, s, hist, pct, isPos, signal, strength, rsi, rangeW }) => {
    const card = document.createElement('div');
    card.className = 'analysis-card';

    const rsiColor = rsi < 35 ? 'var(--green)' : rsi > 65 ? 'var(--red)' : 'var(--amber)';
    const rsiLabel = rsi < 35 ? 'Oversold' : rsi > 65 ? 'Overbought' : 'Neutral';

    card.innerHTML = `
      <div class="analysis-header">
        <div>
          <div class="a-sym">${sym}</div>
          <div class="a-name">${s.name}</div>
        </div>
        <span class="signal-badge ${sigClass(signal)}">${signal}${strength ? ' ' + strength + '%' : ''}</span>
      </div>
      <div class="analysis-grid">
        <div class="a-metric">
          <div class="label">Current</div>
          <div class="value ${isPos === null ? 'neu' : isPos ? 'pos' : 'neg'}">${fmt(s.price)}</div>
        </div>
        <div class="a-metric">
          <div class="label">Prev Close</div>
          <div class="value">${fmt(s.prevClose || s.open)}</div>
        </div>
        <div class="a-metric">
          <div class="label">Change</div>
          <div class="value ${isPos === null ? 'neu' : isPos ? 'pos' : 'neg'}">
            ${pct === null ? '—' : (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%'}
          </div>
        </div>
        <div class="a-metric">
          <div class="label">Volume</div>
          <div class="value">${fmtVol(s.volume)}</div>
        </div>
        <div class="a-metric">
          <div class="label">Day High</div>
          <div class="value pos">${fmt(s.high)}</div>
        </div>
        <div class="a-metric">
          <div class="label">Day Low</div>
          <div class="value neg">${fmt(s.low)}</div>
        </div>
      </div>

      ${rsi !== null ? `
      <div class="a-metric" style="margin-bottom:6px;">
        <div class="rsi-bar-label">
          <span>RSI (${hist.length} ticks)</span>
          <span style="color:${rsiColor}">${rsi} — ${rsiLabel}</span>
        </div>
        <div class="rsi-bar">
          <div class="rsi-fill" style="width:${rsi}%;background:${rsiColor}"></div>
        </div>
      </div>` : ''}

      ${s.high && s.low ? `
      <div class="a-metric" style="margin-bottom:6px;">
        <div class="rsi-bar-label">
          <span>Day range</span>
          <span>${fmt(s.low)} – ${fmt(s.high)}</span>
        </div>
        <div class="rsi-bar">
          <div class="rsi-fill" style="width:${rangeW.toFixed(1)}%;background:#58a6ff"></div>
        </div>
      </div>` : ''}

      <div class="chart-wrap">
        <div class="chart-label">Price history (${hist.length} ticks)</div>
        <canvas id="a-spark-${sym}" style="display:block;width:100%;height:40px;"></canvas>
      </div>
    `;

    container.appendChild(card);

    requestAnimationFrame(() => {
      const cv = document.getElementById('a-spark-' + sym);
      if (cv) {
        const w = card.clientWidth - 40;
        drawSparkline(cv, hist, isPos !== false, w > 0 ? w : 280, 40);
      }
    });
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────
document.getElementById('watchlist-count').textContent = watchlist.length + ' watching';
</script>
</body>
</html>
